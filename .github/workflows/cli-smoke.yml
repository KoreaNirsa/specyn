name: specyn-cli-smoke

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  cli-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ai-server/requirements.txt -r ai-server/requirements-dev.txt -r tools/requirements.txt
      - name: Doctor
        run: python specyn.py doctor
      - name: Init spec smoke
        run: python specyn.py init-spec --project-id smoke-service --output-dir .tmp/specs/smoke-service
      - name: Validate sample-service
        run: python specyn.py validate --spec-dir specs/projects/sample-service
      - name: Compile prompts
        run: python specyn.py compile-prompts --spec-dir specs/projects/sample-service --output-dir .specyn/prompts/sample-service --workspace .workspace/sample-service
      - name: Run local runtime
        run: python specyn.py run --spec-dir specs/projects/sample-service --project-id sample-service --workspace .workspace/sample-service
