spring:
  application:
    name: specyn-backend
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

axbuilder:
  ai:
    base-url: ${AI_SERVER_URL:http://localhost:8000}
    timeout-seconds: 120
  security:
    enabled: ${AXB_SECURITY_ENABLED:false}
  cors:
    allowed-origins: ${AXB_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
