services:
  dashboard-ai-server:
    image: python:3.13-slim
    working_dir: /workspace
    volumes:
      - ./:/workspace
    command: >-
      bash -lc "pip install -r dashboard/ai-server/requirements.txt && python -m uvicorn app.main:app --app-dir dashboard/ai-server --host 0.0.0.0 --port 8100 --reload"
    ports:
      - "8100:8100"

  dashboard-backend:
    image: gradle:8.14.0-jdk21
    working_dir: /workspace/dashboard/backend
    volumes:
      - ./:/workspace
    command: ["gradle", "--no-daemon", "bootRun"]
    environment:
      SERVER_PORT: "8180"
      AI_SERVER_URL: http://dashboard-ai-server:8100
      AXB_CORS_ALLOWED_ORIGINS: http://localhost:4173,http://127.0.0.1:4173
    ports:
      - "8180:8180"
    depends_on:
      - dashboard-ai-server

  dashboard-frontend:
    image: node:20-bookworm
    working_dir: /workspace/dashboard/frontend
    volumes:
      - ./:/workspace
    command: ["sh", "-lc", "npm install && npm run dev -- --host 0.0.0.0 --port 4173"]
    environment:
      VITE_BACKEND_URL: http://localhost:8180
      VITE_AI_SERVER_URL: http://localhost:8100
    ports:
      - "4173:4173"
    depends_on:
      - dashboard-backend
