services:
  ai-server:
    image: python:3.12-slim
    working_dir: /workspace
    env_file:
      - .env
    command: >
      bash -lc "
      python -m venv .venv &&
      . .venv/bin/activate &&
      pip install --upgrade pip &&
      pip install -r ai-server/requirements.txt -r ai-server/requirements-dev.txt -r tools/requirements.txt &&
      uvicorn app.main:app --app-dir ai-server --host 0.0.0.0 --port 8000 --reload
      "
    volumes:
      - .:/workspace
      - pip-cache:/root/.cache/pip
    ports:
      - "8000:8000"

  backend:
    image: gradle:8.14.0-jdk21
    working_dir: /workspace/backend
    env_file:
      - .env
    environment:
      AI_SERVER_URL: http://ai-server:8000
    command: bash -lc "gradle bootRun --no-daemon"
    volumes:
      - .:/workspace
      - gradle-cache:/home/gradle/.gradle
    depends_on:
      - ai-server
    ports:
      - "8080:8080"

  frontend:
    image: node:22
    working_dir: /workspace/frontend
    environment:
      VITE_BACKEND_URL: http://localhost:8080
      VITE_AI_SERVER_URL: http://localhost:8000
    command: bash -lc "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - .:/workspace
      - npm-cache:/root/.npm
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  gradle-cache:
  pip-cache:
  npm-cache:
