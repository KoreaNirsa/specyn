name: sample-service

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sample_service
      POSTGRES_USER: sample_service
      POSTGRES_PASSWORD: sample_service
    ports:
      - "5432:5432"
    volumes:
      - sample_service_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sample_service -d sample_service"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  ai-server:
    build:
      context: ./ai-server
      dockerfile: Dockerfile
    environment:
      PORT: "8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sample_service
      SPRING_DATASOURCE_USERNAME: sample_service
      SPRING_DATASOURCE_PASSWORD: sample_service
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      APP_TASK_REPOSITORY: jdbc
      AI_SERVER_URL: http://ai-server:8000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ai-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api/v1/tasks
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  sample_service_pgdata:
